# Canonical RBC (CRRA utility, Cobb-Douglas production, one TFP shock) -- the
# second-order test fixture. Levels model, NOT auto-linearized (order > 1 is
# levels-only); the expansion point is the steady state below. Lives in tests/,
# not MODELS/.
#
# Mirrors rbc_second_order.mod (the Dynare golden generator) equation for
# equation in natural time: k(t-1) is predetermined capital, k(t) the investment
# choice, and the shock is dated t. The compiler lifts the lags and the shock
# into states of its own.

name: "RBC_SECOND_ORDER"

variables:
  c: {ss_seed: c_ss}
  k: {ss_seed: k_ss}
  z: {ss_seed: null} # z_ss = 0

shocks:
    - e

observables: [c_obs]

equations:
  model:
    euler: "c(t)**(-gamma) = beta * c(t+1)**(-gamma) * (alpha * exp(z(t+1)) * k(t)**(alpha - 1) + 1 - delta)"
    capital: "c(t) + k(t) = exp(z(t)) * k(t-1)**alpha + (1 - delta) * k(t-1)"
    z_process: "z(t) = rho * z(t-1) + e"
  constraint: {}
  observables:
    c_obs: c(t)

calibration:
  parameters:
    beta: 0.99
    gamma: 2.0
    alpha: 0.33
    delta: 0.025
    rho: 0.95
    sig: 0.01
    # Steady state (deterministic), consistent with the calibration above:
    #   k_ss = (alpha / (1/beta - 1 + delta))^(1/(1-alpha))
    #   c_ss = k_ss^alpha - delta*k_ss
    k_ss: 28.348418455829357
    c_ss: 2.3066172286382751
  shocks:
    std:
      e: sig
    corr: {}
