name: Tests & Badges

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests with coverage
        shell: bash
        run: |
          uv run pytest -q ./tests -n auto --dist loadgroup --cov --cov-report=

      - name: Report coverage
        if: always()
        shell: bash
        run: |
          if [ ! -f .coverage ]; then
            echo "No coverage data written; skipping report."
            exit 0
          fi
          mkdir -p coverage
          uv run coverage report --show-missing
          uv run coverage xml -o coverage/coverage.xml

      - name: Compute coverage percent
        id: cov
        shell: bash
        run: |
          python - << 'PY'
          import os
          import xml.etree.ElementTree as ET
          tree = ET.parse("coverage/coverage.xml")
          root = tree.getroot()
          rate = float(root.attrib["line-rate"]) * 100.0
          rounded = round(rate)
          print(f"Coverage: {rate:.2f}%")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"percent={rounded}\n")
          PY

      - name: Generate badges
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/badges"
          curl -fsSL -o "$RUNNER_TEMP/badges/coverage-badge.svg" \
            "https://img.shields.io/badge/coverage-${{ steps.cov.outputs.percent }}%25-2e7d32?style=flat&labelColor=333333"
          curl -fsSL -o "$RUNNER_TEMP/badges/tests-badge.svg" \
            "https://img.shields.io/badge/tests-passing-2e7d32?style=flat&labelColor=333333"

      - name: Publish badges
        if: ${{ github.event_name == 'push' }}
        uses: ./.github/actions/publish-badges
        with:
          source-dir: ${{ runner.temp }}/badges

  test_failed_badge:
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ always() && needs.test.result == 'failure' && github.event_name == 'push' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate failing tests badge
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/badges"
          curl -fsSL -o "$RUNNER_TEMP/badges/tests-badge.svg" \
            "https://img.shields.io/badge/tests-failing-c62828?style=flat&labelColor=333333"

      - name: Publish badges
        uses: ./.github/actions/publish-badges
        with:
          source-dir: ${{ runner.temp }}/badges
