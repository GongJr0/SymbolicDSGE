name: Wheels, Publish & Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI + draft release (leave off to only build & test wheels in isolation)"
        type: boolean
        default: false
      tag:
        description: "Existing tag to publish (required only when 'publish' is checked)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # manylinux x86_64
          - ubuntu-24.04-arm   # manylinux aarch64 (public-repo runner)
          - windows-latest     # win_amd64
          - macos-latest       # arm64 only (numba ships no x86_64 macOS wheels since 0.63)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # UI assets ship in the wheel via package-data; they are identical across
      # platforms and irrelevant to validating the native build, so only build
      # them for real (tag/dispatch) wheels, not PR validation runs.
      - name: Set up Python
        if: github.event_name != 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sdsge-ui/frontend/package-lock.json
      - name: Build frontend into package
        if: github.event_name != 'pull_request'
        run: python scripts/build_frontend.py

      - name: Set up macOS OpenMP toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake llvm
          llvm_prefix="$(brew --prefix llvm)"
          llvm_version="22.1.8"
          libomp_prefix="${RUNNER_TEMP}/libomp"
          llvm_source="${RUNNER_TEMP}/llvm-project-${llvm_version}.src"
          curl --fail --location \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${llvm_version}/llvm-project-${llvm_version}.src.tar.xz" \
            --output "${RUNNER_TEMP}/llvm-project.tar.xz"
          tar -xf "${RUNNER_TEMP}/llvm-project.tar.xz" -C "${RUNNER_TEMP}"
          cmake -S "${llvm_source}/runtimes" -B "${RUNNER_TEMP}/libomp-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${libomp_prefix}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DLIBOMP_INSTALL_ALIASES=OFF \
            -DLLVM_ENABLE_RUNTIMES=openmp \
            -DOPENMP_ENABLE_LIBOMPTARGET=OFF \
            -DOPENMP_ENABLE_OMPT_TOOLS=OFF
          cmake --build "${RUNNER_TEMP}/libomp-build" --parallel
          cmake --install "${RUNNER_TEMP}/libomp-build"
          echo "CC=${llvm_prefix}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${llvm_prefix}/bin/clang++" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          echo "CFLAGS=-I${libomp_prefix}/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L${libomp_prefix}/lib -Wl,-rpath,${libomp_prefix}/lib" >> "$GITHUB_ENV"

      # Reads [tool.cibuildwheel] from pyproject; builds + per-platform tests.
      - name: Build & test wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ENVIRONMENT_WINDOWS: SDSGE_TOOLCHAIN=clang-cl

      - name: Upload wheels
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sdsge-ui/frontend/package-lock.json
      - name: Build frontend into package
        run: python scripts/build_frontend.py
      - name: Build sdist
        run: uv build --sdist
      - name: Upload sdist
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish & Release
    needs: [build_wheels, build_sdist]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write     # create release + upload assets
      id-token: write     # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve tag name
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure tag matches package version
        env:
          TAG_NAME: ${{ steps.vars.outputs.tag }}
        run: python hook_scripts/check_version_match.py

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          draft: true
          files: |
            dist/*.whl
            dist/*.tar.gz
