name: "TEST"

variables: [u, v, r, Pi, x, r_star]

shocks:
    - e_u
    - e_v

observables: [Infl, Rate]

equations:
    # Equations are written in natural time. Lags stay where they belong; the
    # compiler lifts each one into a state of its own. Shocks are dated t.

    model:
        # Placeholder Phillips Curve:
        nkpc: "Pi(t) = beta*Pi(t+1) + kappa*x(t)"

        # Placeholder IS / Euler equation:
        euler: "x(t) = x(t+1) - sigma*(r(t) - Pi(t+1)) + u(t)"

        # Placeholder AR(1) demand shock:
        u_process: "u(t) = rho_u*u(t-1) + e_u"

        # Placeholder Taylor-rule target rate:
        taylor: "r_star(t) = rbar + phi_pi*Pi(t) + phi_x*x(t) + v(t)"

        # Placeholder Interest-rate smoothing:
        policy: "r(t) = rho_r*r(t-1) + (1 - rho_r)*r_star(t)"

        # Placeholder Monetary policy shock:
        v_process: "v(t) = rho_v*v(t-1) + e_v"

    constraint: {}

    observables:
        # Observed inflation level:
        Infl: Pi(t) + pi_mean
        # Observed policy rate:
        Rate: r(t)

calibration:
    parameters:
        # Placeholder Discount factor:
        beta: 0.99

        # Placeholder Intertemporal elasticity inverse:
        sigma: 1.0

        # Placeholder NKPC slope kappa:
        kappa: 0.024

        # Placeholder policy parameters:
        phi_pi: 2.15
        phi_x: 0.93
        rho_r: 0.79

        # Placeholder Demand shock AR(1):
        rho_u: 0.70
        sig_u: 0.50

        # Placeholder Monetary policy shock AR(1):
        rho_v: 0.50
        sig_v: 0.25

        rbar: 0.0
        pi_mean: 3.25
        elb_level: 0.0

    shocks:
        std:
            e_u: sig_u
            e_v: sig_v
        corr: {}
